<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     

    <title>Sumador de Numeros</title>
</head>
<body>
<h1 class="text-center mt-4">Sumador de numeros</h1>
<div class="container mt-4">
  <div class="row">
    <div class="col-12 col-md-5 mt-2 mt-md-0">
      <input type="number" id="primer-numero" class="form-control numero-suma" />
    </div>
    <div class="col-12 col-md-5 mt-2 mt-md-0">
      <input type="number" id="segundo-numero" class="form-control numero-suma" />
    </div>
    <div class="col-12 col-md-2 text-center mt-2 mt-md-0">
      <button id="boton-sumar" class="btn btn-primary">Sumar</button>
    </div>
  </div>
</div>



<script src="script.js"></script>
</body>
</html>
